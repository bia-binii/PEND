<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
</head>
<body>

    <h1>Permissão de localização</h1>

    <div id="sucesso">
        <img
            id="imagem-sucesso"
            src="loc_permitida.jpg"
            alt="Localização permitida">

        <p>Conseguimos acessar sua localização.</p>
    </div>


    <div id="erro">
        <img
            id="imagem-erro"
            src="loc_erro.png"
            alt="Localização negada">

        <p>Não foi possível acessar sua localização.</p>
    </div>

    <script src="exemplo.js"></script>

</body>
</html>

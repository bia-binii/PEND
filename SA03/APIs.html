<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direto ao ponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span>Direto ao ponto</span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="widgets">
    <div class="widget loading" id="w-weather">
      <span class="icon">🌤️</span>
      <div class="meta">
        <span class="label" id="weather-label">SUA LOCALIZAÇÃO</span>
        <span class="value" id="weather-value">carregando…</span>
      </div>
    </div>

    <div class="widget loading" id="w-usd">
      <span class="icon">💵</span>
      <div class="meta">
        <span class="label">DÓLAR</span>
        <span class="value" id="usd-value">carregando…</span>
      </div>
    </div>

    <div class="widget loading" id="w-eur">
      <span class="icon">💶</span>
      <div class="meta">
        <span class="label">EURO</span>
        <span class="value" id="eur-value">carregando…</span>
      </div>
    </div>

    <div class="widget loading" id="w-btc">
      <span class="icon">₿</span>
      <div class="meta">
        <span class="label">BITCOIN</span>
        <span class="value" id="btc-value">carregando…</span>
      </div>
    </div>
  </div>

  <div class="refresh-wrap">
    <button class="refresh" id="refresh-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
      </svg>
      Atualizar
    </button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
